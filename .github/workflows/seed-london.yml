name: London venue identity index
on:
  schedule:
    # Both UTC slots handle London DST. The backend accepts only local 03:00.
    # Sunday starts the weekly round; other days resume only unfinished rounds.
    - cron: '0 2,3,8,9 * * *'
    # Both UTC slots handle London DST for a local 04:00 focus-area run.
    # The backend rejects the unused UTC slot; retries resume only incomplete work.
    - cron: '0 3,4 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Seed the standard London schedule or the priority south-west clusters'
        required: true
        type: choice
        default: standard
        options:
          - standard
          - focus-areas
permissions:
  contents: read
  id-token: write
concurrency:
  group: london-venue-identity-index
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Seed or resume the external Panda index
        env:
          SEED_SCOPE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3,4 * * *' && 'focus-areas' || github.event.inputs.scope || 'standard' }}
        run: node scripts/seed-london.mjs https://panda-ai-proxy.vercel.app "$SEED_SCOPE"
